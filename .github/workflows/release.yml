name: Release

# A pushed `v*` tag builds the installers and creates a DRAFT release. Nothing reaches users
# until the owner opens the draft on GitHub, tests the CI-built installers and presses
# "Publish" (that is the moment `releases/latest/download/latest.json` starts pointing at it,
# which is what the in-app updater reads).
#
# Repository settings this workflow reads (Settings > Secrets and variables > Actions):
#   secrets.TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       updater signing key; the build fails without them (updater artifacts are signed)
#   vars.FLEXI_DESK_GOOGLE_CLIENT_ID  (or secrets.FLEXI_DESK_GOOGLE_CLIENT_ID)
#   secrets.FLEXI_DESK_GOOGLE_CLIENT_SECRET
#       the Google OAuth "Desktop app" client, compiled in at build time. Without the client
#       id the "Continue with Google" button is hidden in the released installers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FLEXI_DESK_GOOGLE_CLIENT_ID: ${{ vars.FLEXI_DESK_GOOGLE_CLIENT_ID || secrets.FLEXI_DESK_GOOGLE_CLIENT_ID }}
          FLEXI_DESK_GOOGLE_CLIENT_SECRET: ${{ secrets.FLEXI_DESK_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FlexiDesk ${{ github.ref_name }}'
          releaseBody: 'See the assets below for platform-specific installers.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
